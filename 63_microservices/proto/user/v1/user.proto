syntax = "proto3";

package user.v1;

option go_package = "example.com/go-basics/63_microservices/gen/user/v1;userv1";

// The user service owns users. NOTHING else reads its database -- that is
// the single rule that makes this a microservice instead of a distributed
// monolith. If the order service wants a user, it asks over this API.
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ValidateCredit(ValidateCreditRequest) returns (ValidateCreditResponse);
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  int64 credit_limit_cents = 4;
  bool active = 5;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ValidateCreditRequest {
  string user_id = 1;
  int64 amount_cents = 2;
}

message ValidateCreditResponse {
  bool approved = 1;
  int64 remaining_cents = 2;
  string reason = 3;
}
